# ~/.config/tmux/tmux.conf  (symlink para linux_config/home/.config/tmux/tmux.conf)
#
# prefix: C-b ou C-a          recarregar: prefix r      editar: prefix e
# plugins: prefix I (instalar) / prefix U (atualizar)

# -- geral ---------------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"        # true color

set -g prefix2 C-a
bind C-a send-prefix -2

set -s escape-time 10
set -sg repeat-time 600
set -s focus-events on
set -g history-limit 50000
set -g mouse on

set -g base-index 1                       # janelas começam em 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename off              # nomes manuais de janela persistem
set -g set-titles on

set -g display-panes-time 800
set -g display-time 1000
set -g status-interval 10
setw -g monitor-activity on
set -g visual-activity off

# -- atalhos -------------------------------------------------------------------

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf recarregado"
bind e new-window -n tmux.conf '${EDITOR:-vim} ~/.config/tmux/tmux.conf && tmux source-file ~/.config/tmux/tmux.conf && tmux display "tmux.conf recarregado"'

bind C-c new-session
bind C-f command-prompt -p find-session "switch-client -t '%%'"

# limpa a tela e o histórico
bind -n C-l send-keys C-l \; run 'sleep 0.2' \; clear-history

# splits e janelas novas abrem no diretório atual
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# navegar entre panes (hjkl), redimensionar (HJKL), trocar de lugar (< >)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2
bind > swap-pane -D
bind < swap-pane -U
bind + resize-pane -Z                     # maximiza/restaura o pane

# janelas
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window

bind m set -g mouse \; display "mouse: #{?mouse,on,off}"
bind C-s setw synchronize-panes \; display "sync panes: #{?synchronize-panes,on,off}"
bind g send-keys 'git status' Enter

# -- copy mode (vi) + clipboard do sistema -------------------------------------

setw -g mode-keys vi
set -s copy-command 'if [ -n "$WAYLAND_DISPLAY" ]; then wl-copy; else xclip -in -selection clipboard; fi'
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

# -- plugins -------------------------------------------------------------------

set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.config/tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.2'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# catppuccin: as opções precisam vir ANTES de carregar o tema
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_status_cpu_text_fg "#{E:@thm_fg}"
set -g @catppuccin_status_cpu_text_bg ""
if "test -f ~/.config/tmux/plugins/tmux/catppuccin.tmux" \
  "run ~/.config/tmux/plugins/tmux/catppuccin.tmux"

# barra de status: app | cpu | ram | sessão | uptime | bateria
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#[fg=#{@thm_blue}]#{E:@catppuccin_status_right_separator}#[fg=#{@thm_fg},bg=#{@thm_surface_0}] 󰍛 #{ram_percentage} #[fg=#{@thm_surface_0}]#{E:@catppuccin_status_right_separator}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# instala o TPM + plugins automaticamente na primeira vez; deve ser a última linha
if "test ! -d ~/.config/tmux/plugins/tpm" \
  "run 'git clone -q https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"
run '~/.config/tmux/plugins/tpm/tpm'
